name: Build and Publish Arch Repository

# PRODUCTION WORKFLOW — migration to GitHub-hosted runners + generic Arch
# container (see build-in-docker.sh for the ISA rationale).
#
# RUN MODE (manual-only until explicitly approved):
#   - The cron schedule is DISABLED. The workflow can only be started by
#     `workflow_dispatch` (UI button or `gh workflow run`), with an extra
#     confirmation input `confirm-production`).
#   - Enable the schedule only after a successful manual production
#     verification run (change `schedule:` back to `- cron: '15 * * * *'`
#     in a PR approved by the repository owner).
#
# The publish job is non-destructive: it uploads refreshed assets with
# `--clobber` into the existing release, deletes only assets that are
# stale relative to packages.txt AND not protected by a failed/restored
# build, and never deletes/recreates the release itself. The repository
# database is generated AFTER validate-release.sh confirms archive
# integrity and DB↔asset consistency.

on:
  # DISABLED during migration: re-enable only after manual production
  # verification passes.
  # schedule:
  #   - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      confirm-production:
        description: 'Type YES to run a production build/update (manual verification)'
        required: true
        type: string
        default: ''
      packages:
        description: 'Comma-separated package names to build from packages.txt. Leave empty to build the full packages.txt matrix (minus system-critical packages).'
        required: false
        type: string
        default: ''
      allow-critical:
        description: 'Comma-separated system-critical packages to include (e.g. linux-nanoka). Leave empty to exclude them all.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-repo
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  RELEASE_TAG: repository
  REPO_DB_NAME: 88kbleirad
  BUILD_PROFILE: x86-64-v4
  # digest-pinned generic Arch Linux container (baseline x86-64 ISA)
  BUILD_IMAGE: ghcr.io/archlinux/archlinux@sha256:644576e90a71df3b137df2ab6b3517ecd045418195c1946c2c11d1c0564a7981

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      missing: ${{ steps.set-matrix.outputs.missing }}
      excluded_bases_file: ${{ steps.set-matrix.outputs.excluded_bases_file }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Require explicit production confirmation (manual mode)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          CONFIRM="${{ github.event.inputs.confirm-production }}"
          if [[ "$CONFIRM" != "YES" ]]; then
            echo "::error::Production runs require the 'confirm-production' input set to YES (manual verification mode)."
            exit 1
          fi

      - name: Generate matrix from packages.txt (single source of truth)
        id: set-matrix
        run: |
          set -euo pipefail
          if [[ ! -f packages.txt ]]; then
            echo "::error::packages.txt not found at repo root"
            exit 1
          fi

          # System-critical packages are EXCLUDED from the automatic matrix.
          # They are built only when a manual run explicitly approves them
          # by exact name via the `allow-critical` input (and never on a
          # scheduled run, which has no inputs).
          CRITICAL=(
            pacman
            nvidia-utils lib32-nvidia-utils
            xlibre-xserver xlibre-xserver-src xlibre-input-libinput
            linux-nanoka
            networkmanager-iwd
          )
          APPROVED_CRITICAL=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IFS=',' read -r -a requested_critical <<< "${{ inputs.allow-critical }}"
            for c in "${requested_critical[@]}"; do
              c="$(echo "$c" | xargs)"
              [[ -n "$c" ]] || continue
              if ! printf '%s\n' "${CRITICAL[@]}" | grep -qx "$c"; then
                echo "::error::'$c' is not a known system-critical package; refusing the approval list."
                exit 1
              fi
              APPROVED_CRITICAL+=("$c")
            done
          fi
          is_approved() {
            local pkg="$1" c
            for c in "${APPROVED_CRITICAL[@]:-}"; do
              [[ "$pkg" == "$c" ]] && return 0
            done
            return 1
          }
          is_critical() {
            local pkg="$1" c
            for c in "${CRITICAL[@]}"; do
              [[ "$pkg" == "$c" ]] && return 0
            done
            return 1
          }
          # true when the package appears in the dispatch `packages` input
          is_requested() {
            local pkg="$1" req
            [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || return 1
            [[ -n "${{ inputs.packages }}" ]] || return 1
            IFS=',' read -r -a _reqs <<< "${{ inputs.packages }}"
            for req in "${_reqs[@]}"; do
              [[ "$(echo "$req" | xargs)" == "$pkg" ]] && return 0
            done
            return 1
          }

          pkgs=()
          missing=()
          excluded=()
          REQUESTED_SUBSET=false

          # Optional subset: validate every requested name against
          # packages.txt (single source of truth). Unknown names fail the
          # run loudly instead of silently building nothing.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.packages }}" ]]; then
            REQUESTED_SUBSET=true
            declare -A PACKAGES_TXT=()
            while IFS= read -r raw_line || [[ -n "$raw_line" ]]; do
              pkg_entry="$(echo "$raw_line" | sed 's/#.*//' | xargs)"
              [[ -z "$pkg_entry" ]] && continue
              PACKAGES_TXT["${pkg_entry#local:}"]=1
            done < packages.txt

            IFS=',' read -r -a requested <<< "${{ inputs.packages }}"
            for req in "${requested[@]}"; do
              req="$(echo "$req" | xargs)"
              [[ -n "$req" ]] || continue
              if [[ -z "${PACKAGES_TXT[$req]:-}" ]]; then
                echo "::error::Requested package '$req' is not listed in packages.txt; refusing subset selection."
                exit 1
              fi
            done
          fi

          while IFS= read -r raw_line || [[ -n "$raw_line" ]]; do
            pkg_entry="$(echo "$raw_line" | sed 's/#.*//' | xargs)"
            [[ -z "$pkg_entry" ]] && continue
            # local: prefix marks manually maintained packages inside the repo
            pkg="${pkg_entry#local:}"
            if [[ ! -f "$pkg/PKGBUILD" ]]; then
              echo "::warning::packages.txt entry '$pkg' has no PKGBUILD directory; skipped"
              missing+=("$pkg")
              continue
            fi
            if is_critical "$pkg"; then
              if is_approved "$pkg"; then
                echo "::notice::system-critical package '$pkg' explicitly approved for this run."
                pkgs+=("$pkg")
              elif is_requested "$pkg"; then
                # explicit user request for a system-critical package
                # without allow-critical approval: fail loudly, never
                # silently drop the request
                echo "::error::Requested system-critical package '$pkg' requires explicit approval. Add '$pkg' to the 'allow-critical' input to build it."
                exit 1
              else
                echo "::warning::system-critical package '$pkg' excluded from the default matrix (requires explicit 'allow-critical' approval)."
                excluded+=("$pkg")
              fi
              continue
            fi
            if [[ "$REQUESTED_SUBSET" == "true" ]]; then
              # subset mode: keep only requested noncritical packages
              selected=0
              IFS=',' read -r -a requested <<< "${{ inputs.packages }}"
              for req in "${requested[@]}"; do
                req="$(echo "$req" | xargs)"
                [[ "$req" == "$pkg" ]] && { selected=1; break; }
              done
              [[ $selected -eq 1 ]] || continue
            fi
            pkgs+=("$pkg")
          done < packages.txt

          if (( ${#pkgs[@]} == 0 )); then
            echo "::error::No buildable packages found (empty selection). Refusing to run."
            exit 1
          fi

          MATRIX_JSON=$(printf '%s\n' "${pkgs[@]}" | jq -R . | jq -s -c .)
          echo "Found packages: $MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          if (( ${#missing[@]} > 0 )); then
            echo "missing=$(printf '%s,' "${missing[@]}" | sed 's/,$//')" >> "$GITHUB_OUTPUT"
          fi
          if (( ${#excluded[@]} > 0 )); then
            echo "excluded=$(printf '%s,' "${excluded[@]}" | sed 's/,$//')" >> "$GITHUB_OUTPUT"
            # publish-prod.sh must never prune assets of excluded packages
            printf '%s\n' "${excluded[@]}" > output-excluded-bases.txt
            # also expose as a job output so downstream jobs can pass it
            # through to the publish container
            echo "excluded_bases_file=output-excluded-bases.txt" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## Package selection (packages.txt)"
            echo ""
            echo "- Buildable entries: ${#pkgs[@]}"
            if (( ${#missing[@]} > 0 )); then
              echo "- Missing PKGBUILD definitions (skipped): ${missing[*]}"
            fi
            if (( ${#excluded[@]} > 0 )); then
              echo "- System-critical packages excluded (explicit approval required): ${excluded[*]}"
            fi
            echo "- Matrix built from packages.txt only."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      PKG: ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build package in managed container (architecture-aware cache)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.BUILD_IMAGE }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/build-in-docker.sh"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.package }}
          path: output/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository (for validation scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: output
          pattern: pkg-*
          merge-multiple: true

      - name: Validate, build database and publish in managed container
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.BUILD_IMAGE }}
          PUBLISH_SCRIPT: publish-prod.sh
          EXCLUDED_BASES_FILE: ${{ needs.prepare.outputs.excluded_bases_file }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/publish-in-docker.sh"
