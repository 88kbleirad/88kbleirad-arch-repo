name: Build and Publish Arch Repository

# PRODUCTION WORKFLOW — migration to GitHub-hosted runners + generic Arch
# container (see build-in-docker.sh for the ISA rationale).
#
# RUN MODE:
#   - Manual runs require `confirm-production=YES` (workflow_dispatch).
#   - `signing-mode` selects the publication mode:
#       unsigned (default) — no GPG key, no protected environment; the
#         repository is published unsigned and any leftover detached
#         signatures are purged so nothing mismatched stays online.
#       signed — strict GPG signing + verification of every package and
#         the database; requires the protected `package-signing`
#         environment. A signed request NEVER silently downgrades to
#         unsigned if signing fails.
#   - Scheduled runs use a SEPARATE, explicitly authorized path:
#     `schedule:weekly` below. The cron entry remains commented out and is
#     enabled only in a separately approved PR (owner-approved). The
#     prepare job rejects scheduled runs unless a dedicated repository
#     variable `ALLOW_SCHEDULED_PRODUCTION=yes` is set; scheduled builds
#     never include system-critical packages, never accept inputs and
#     always publish unsigned (no protected environment).
#
# The publish job is non-destructive: it uploads refreshed assets with
# `--clobber` into the existing release, deletes only assets that are
# stale relative to packages.txt AND not protected by a failed/restored
# build, and never deletes/recreates the release itself. The repository
# database is generated AFTER validate-release.sh confirms archive
# integrity and DB↔asset consistency.

on:
  # Weekly production build. DISABLED until separately approved: enable
  # by uncommenting and keeping the `ALLOW_SCHEDULED_PRODUCTION=yes`
  # repository variable gate in the prepare job.
  # schedule:
  #   - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      confirm-production:
        description: 'Type YES to run a production build/update (manual verification)'
        required: true
        type: string
        default: ''
      packages:
        description: 'Comma-separated package names to build from packages.txt. Leave empty to build the full packages.txt matrix (minus system-critical packages).'
        required: false
        type: string
        default: ''
      allow-critical:
        description: 'Comma-separated system-critical packages to include (e.g. linux-nanoka). Leave empty to exclude them all.'
        required: false
        type: string
        default: ''
      signing-mode:
        description: 'Publishing mode. unsigned (default): no GPG required, no signing environment. signed: strict GPG signing + signature verification (requires the package-signing environment).'
        required: false
        type: choice
        options:
          - unsigned
          - signed
        default: unsigned

permissions:
  contents: read

concurrency:
  group: release-repo
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  RELEASE_TAG: repository
  REPO_DB_NAME: 88kbleirad
  BUILD_PROFILE: x86-64-v4
  # digest-pinned generic Arch Linux container (baseline x86-64 ISA)
  BUILD_IMAGE: ghcr.io/archlinux/archlinux@sha256:644576e90a71df3b137df2ab6b3517ecd045418195c1946c2c11d1c0564a7981

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      missing: ${{ steps.set-matrix.outputs.missing }}
      excluded_bases_file: ${{ steps.set-matrix.outputs.excluded_bases_file }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate signing mode input (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          INPUT_SIGNING_MODE: ${{ inputs.signing-mode }}
        run: |
          set -euo pipefail
          case "$INPUT_SIGNING_MODE" in
            unsigned|signed) ;;
            *) echo "::error::Invalid signing-mode '$INPUT_SIGNING_MODE' (expected unsigned|signed)."; exit 1 ;;
          esac
          echo "::notice::Production publication mode: $INPUT_SIGNING_MODE"

      - name: Generate matrix (shared validation, env-bindings only)
        id: set-matrix
        env:
          MODE: production
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CONFIRM_PRODUCTION: ${{ inputs.confirm-production }}
          INPUT_PACKAGES: ${{ inputs.packages }}
          INPUT_ALLOW_CRITICAL: ${{ inputs.allow-critical }}
          ALLOW_SCHEDULED_PRODUCTION: ${{ vars.ALLOW_SCHEDULED_PRODUCTION }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/generate-matrix.sh"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      PKG: ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build package in managed container (architecture-aware cache)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.BUILD_IMAGE }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/build-in-docker.sh"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.package }}
          path: output/*
          if-no-files-found: error
          retention-days: 1

  # Unsigned production publish (default). No GPG, no protected
  # environment; runs with contents:write only.
  publish:
    needs: [prepare, build]
    if: ${{ inputs.signing-mode != 'signed' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository (for validation scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: output
          pattern: pkg-*
          merge-multiple: true

      - name: Validate, build database and publish in managed container (unsigned)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.BUILD_IMAGE }}
          PUBLISH_SCRIPT: publish-prod.sh
          EXCLUDED_BASES_FILE: ${{ needs.prepare.outputs.excluded_bases_file }}
          SIGNING_MODE: unsigned
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/publish-in-docker.sh"

  # Signed production publish: enters the protected environment, requires
  # the signing secret, and never silently downgrades on signing failure.
  publish-signed:
    needs: [prepare, build]
    if: ${{ inputs.signing-mode == 'signed' }}
    runs-on: ubuntu-24.04
    environment: package-signing
    permissions:
      contents: write
    steps:
      - name: Checkout repository (for validation scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: output
          pattern: pkg-*
          merge-multiple: true

      - name: Prepare GPG signing key (secret file, never logged)
        env:
          GPG_KEY_CONTENT: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE_CONTENT: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$GPG_KEY_CONTENT" ]]; then
            echo "::error::GPG_PRIVATE_KEY is not configured in the 'package-signing' environment; signed publication requires signatures."
            exit 1
          fi
          printf '%s\n' "$GPG_KEY_CONTENT" > /tmp/gpg-key.asc
          chmod 600 /tmp/gpg-key.asc
          echo "GPG_KEY_FILE=/tmp/gpg-key.asc" >> "$GITHUB_ENV"
          if [[ -n "$GPG_PASSPHRASE_CONTENT" ]]; then
            printf '%s\n' "$GPG_PASSPHRASE_CONTENT" > /tmp/gpg-passphrase
            chmod 600 /tmp/gpg-passphrase
            echo "GPG_PASSPHRASE_FILE=/tmp/gpg-passphrase" >> "$GITHUB_ENV"
          fi
          echo "::notice::GPG signing key materialized for this signed publish job only (value never echoed)."

      - name: Validate, build database and publish in managed container (signed)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.BUILD_IMAGE }}
          PUBLISH_SCRIPT: publish-prod.sh
          EXCLUDED_BASES_FILE: ${{ needs.prepare.outputs.excluded_bases_file }}
          SIGNING_MODE: signed
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/publish-in-docker.sh"
