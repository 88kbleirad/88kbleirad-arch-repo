name: Package Lifecycle

# Phase 4.4 + Phase 5.1 — read-only package lifecycle detection. Never
# modifies package sources, never pushes to main, never publishes. Produces
# a machine-readable lifecycle JSON report + Markdown summary; optionally
# opens (or updates) a reviewable update-proposal PR (Phase 5.2) via the
# `propose-updates` job — never merged automatically.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated packages to check (default: all in packages.txt)'
        required: false
        type: string
        default: ''
      open-pr:
        description: 'Create/update reviewable update-proposal PRs (Phase 5.2; requires confirmed updates)'
        required: false
        type: boolean
        default: false
      allow-remote-pr:
        description: 'OWNER-GATED: authorize remote PR write for the Phase 5.2 validation fixture only (docs/update-proposals/validation/). Never used for real proposals.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-detection
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # vercmp is provided by the `makepkg` package on Ubuntu/Debian
          # (the `pacman-contrib` package does not exist in the Ubuntu
          # archive). The detector refuses to run without vercmp.
          sudo apt-get install -y -qq jq curl git makepkg

      - name: Verify vercmp availability
        run: |
          set -euo pipefail
          if ! command -v vercmp >/dev/null 2>&1; then
            echo "::error::dependency provisioning failed: vercmp not found after installing makepkg. Install the 'makepkg' package (provides vercmp) and re-run."
            exit 1
          fi
          echo "::notice::vercmp available: $(command -v vercmp) ($(vercmp --version 2>/dev/null | head -1 || true))"

      - name: Run update detection (read-only)
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          INPUT_PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          args=(--json "$GITHUB_WORKSPACE/update-report.json" --summary "$GITHUB_STEP_SUMMARY")
          if [[ -n "$INPUT_PACKAGES" ]]; then
            IFS=',' read -ra PKG_ARRAY <<< "$INPUT_PACKAGES"
            args+=("${PKG_ARRAY[@]}")
          fi
          bash "$GITHUB_WORKSPACE/.github/scripts/check-updates.sh" "${args[@]}"
          # exit 0 on success; the checker never fails on upstream hiccups
          # (reported as CHECK_FAILED)

      - name: Upload update report artifact
        uses: actions/upload-artifact@v7
        with:
          name: update-report
          path: update-report.json
          retention-days: 14
          if-no-files-found: error

      - name: Summarize lifecycle classification counts
        run: |
          set -euo pipefail
          jq -r 'group_by(.update_type)[] | "\(.[0].update_type): \(length)"' \
            "$GITHUB_WORKSPACE/update-report.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo
          echo "Packages checked: $(jq 'length' "$GITHUB_WORKSPACE/update-report.json")" | tee -a "$GITHUB_STEP_SUMMARY"

  # Phase 5.2: propose updates as a reviewable PR. Deterministic branch
  # (same verified updates => same branch/PR, never duplicated). The PR is
  # a review proposal only: merging it does NOT publish anything, and the
  # workflow never merges automatically.
  propose:
    needs: detect
    if: ${{ inputs.open-pr }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download lifecycle report
        uses: actions/download-artifact@v8
        with:
          name: update-report
          path: "${{ github.workspace }}/lifecycle-report"
          merge-multiple: true

      - name: Generate proposals and open/update PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          ALLOW_REMOTE_PR: ${{ inputs.allow-remote-pr }}
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/lifecycle-report/update-report.json"
          [[ -s "$report" ]] || { echo "::error::lifecycle report missing"; exit 1; }
          args=(--report "$report" --repo "${{ github.repository }}" --base main --push)
          # OWNER-GATED Phase 5.2 validation: only runs when the owner
          # dispatches with BOTH open-pr=true and allow-remote-pr=true.
          # It creates a documentation-only fixture branch/PR under
          # validation/phase5-pr-test-<id> — never real proposals.
          # The id is deterministic (report digest) so reruns are
          # idempotent: same branch, same PR, never duplicated.
          if [[ "${ALLOW_REMOTE_PR}" == "true" ]]; then
            fixture_id="$(jq -r 'map(.package) | sort | join(",") | @base64' "$report" | tr -d '=' | head -c 12)"
            args+=(--fixture "owner-${fixture_id}" --allow-remote-pr)
          fi
          bash "$GITHUB_WORKSPACE/.github/scripts/propose-updates.sh" "${args[@]}"
