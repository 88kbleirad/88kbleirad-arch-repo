name: Build and Publish Staging Repository (v4 test)

# STAGING WORKFLOW — does NOT run on the production cron schedule.
# Only runs when triggered manually with the "Run workflow" button
# (workflow_dispatch) or via the gh CLI:
#   gh workflow run build-staging.yml -f packages=nmtui-go,osu-mime
# It publishes to the `repository-v4-test` release tag only; the
# production `repository` release is never touched by this workflow.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated package directories to build (default: nmtui-go,osu-mime)'
        required: false
        default: 'nmtui-go,osu-mime'
      include-ksuperkey:
        description: 'Include ksuperkey (3rd noncritical package)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-repo-v4-test
  cancel-in-progress: true

env:
  RELEASE_TAG: repository-v4-test
  REPO_DB_NAME: 88kbleirad
  BUILD_PROFILE: x86-64-v4

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build staging matrix
        id: set-matrix
        run: |
          set -euo pipefail
          # default set from input, or the two canonical smoke packages
          IN="${{ inputs.packages }}"
          if [[ -z "$IN" ]]; then
            IN="nmtui-go,osu-mime"
          fi
          if [[ "${{ inputs.include-ksuperkey }}" == "true" ]]; then
            IN="${IN},ksuperkey"
          fi

          pkgs=()
          IFS=',' read -r -a requested <<< "$IN"
          for pkg in "${requested[@]}"; do
            pkg="$(echo "$pkg" | xargs)"
            [[ -n "$pkg" ]] || continue
            if [[ ! -f "$pkg/PKGBUILD" ]]; then
              echo "::error::requested package '$pkg' has no PKGBUILD directory; aborting"
              exit 1
            fi
            # staging safety: never allow system-critical packages
            case "$pkg" in
              pacman|nvidia-utils|lib32-nvidia-utils|xlibre-xserver|networkmanager-iwd|linux-nanoka)
                echo "::error::system-critical package '$pkg' is forbidden in staging"
                exit 1
                ;;
            esac
            pkgs+=("$pkg")
          done

          if (( ${#pkgs[@]} == 0 )); then
            echo "::error::no valid packages requested"
            exit 1
          fi

          MATRIX_JSON=$(printf '%s\n' "${pkgs[@]}" | jq -R . | jq -s -c .)
          echo "staging matrix: $MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

          {
            echo "## Staging build ($RELEASE_TAG)"
            echo ""
            echo "- Packages: ${pkgs[*]}"
            echo "- Target: x86-64-v4 (CachyOS)"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Temporary isolation test: sequential builds while the container
      # lifecycle fix is validated. Restore to 2 once staging is stable.
      max-parallel: 1
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      PKG: ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build package in managed container (architecture-aware cache)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: cachyos/cachyos-v4:latest
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/build-in-docker.sh"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.package }}
          path: output/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (for validation scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: output
          pattern: pkg-*
          merge-multiple: true

      - name: Validate, build database and publish in managed container
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/archlinux/archlinux:latest
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/publish-in-docker.sh"
