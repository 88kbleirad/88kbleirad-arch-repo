name: Build and Publish Staging Repository (v4 test)

# STAGING WORKFLOW — does NOT run on the production cron schedule.
# Only runs when triggered manually with the "Run workflow" button
# (workflow_dispatch) or via the gh CLI:
#   gh workflow run build-staging.yml -f packages=nmtui-go,osu-mime
# It publishes to the `repository-v4-test` release tag only; the
# production `repository` release is never touched by this workflow.
#
# Builds run on GitHub-hosted ubuntu-24.04 runners inside a GENERIC Arch
# Linux container (ghcr.io/archlinux/archlinux), which only needs the
# baseline x86-64 ISA. The toolchain targets x86-64-v4 via the CachyOS v4
# compiler profile (-march=x86-64-v4 / -C target-cpu=x86-64-v4): we target
# the ISA at compile time without executing v4 system binaries on the host.
# (The CachyOS v4 image itself requires AVX-512 and SIGILLs with exit 132
# on hosts lacking it -- see build-in-docker.sh for the analysis.)

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated package directories to build (default: nmtui-go,osu-mime)'
        required: false
        default: 'nmtui-go,osu-mime'
      include-ksuperkey:
        description: 'Include ksuperkey (3rd noncritical package)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-repo-v4-test
  cancel-in-progress: true

env:
  RELEASE_TAG: repository-v4-test
  REPO_DB_NAME: 88kbleirad
  BUILD_PROFILE: x86-64-v4

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build staging matrix (shared validation, env-bindings only)
        id: set-matrix
        env:
          MODE: staging
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGES: ${{ inputs.packages }}
          INPUT_INCLUDE_KSUPERKEY: ${{ inputs.include-ksuperkey }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/generate-matrix.sh"

  build:
    needs: prepare
    # GitHub-hosted runners exclusively. The generic Arch container runs on
    # the baseline x86-64 ISA (safe on any ubuntu-24.04 VM); the toolchain
    # inside it targets x86-64-v4 (see build-in-docker.sh).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      PKG: ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build package in managed container (architecture-aware cache)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/archlinux/archlinux@sha256:644576e90a71df3b137df2ab6b3517ecd045418195c1946c2c11d1c0564a7981
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/build-in-docker.sh"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.package }}
          path: output/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    environment: package-signing
    permissions:
      contents: write
    steps:
      - name: Checkout repository (for validation scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: output
          pattern: pkg-*
          merge-multiple: true

      - name: Prepare GPG signing key (secret file, never logged)
        env:
          GPG_KEY_CONTENT: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE_CONTENT: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$GPG_KEY_CONTENT" ]]; then
            echo "::error::GPG_PRIVATE_KEY is not configured in the 'package-signing' environment; staging publication requires signatures."
            exit 1
          fi
          printf '%s\n' "$GPG_KEY_CONTENT" > /tmp/gpg-key.asc
          chmod 600 /tmp/gpg-key.asc
          echo "GPG_KEY_FILE=/tmp/gpg-key.asc" >> "$GITHUB_ENV"
          if [[ -n "$GPG_PASSPHRASE_CONTENT" ]]; then
            printf '%s\n' "$GPG_PASSPHRASE_CONTENT" > /tmp/gpg-passphrase
            chmod 600 /tmp/gpg-passphrase
            echo "GPG_PASSPHRASE_FILE=/tmp/gpg-passphrase" >> "$GITHUB_ENV"
          fi
          echo "::notice::GPG signing key materialized for this publish job only (value never echoed)."

      - name: Validate, build database and publish in managed container
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/archlinux/archlinux@sha256:644576e90a71df3b137df2ab6b3517ecd045418195c1946c2c11d1c0564a7981
          EXPECTED_PACKAGES: ${{ needs.prepare.outputs.matrix }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/publish-in-docker.sh"
